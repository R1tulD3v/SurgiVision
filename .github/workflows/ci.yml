name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch keeps the job fast.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy nibabel fastapi python-multipart
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Byte-compile all modules
        run: python -m py_compile *.py tests/*.py

      - name: Run tests
        run: pytest -q
