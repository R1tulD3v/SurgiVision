services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: surgivision
      POSTGRES_PASSWORD: surgivision
      POSTGRES_DB: surgivision
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surgivision"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    environment:
      SURGIVISION_DATABASE_URL: postgresql+psycopg://surgivision:surgivision@db:5432/surgivision
      SURGIVISION_MODELS_DIR: /models
    volumes:
      # Mount the trained model at runtime (kept out of the image / git).
      - ./models:/models:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
